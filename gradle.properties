org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# ForgeGradle: put classes and resources of the Forge module in one directory, required by Forge dev runs.
net.minecraftforge.gradle.merge-source-sets=true

minecraft_version=26.3
minecraft_version_range=[26.3]
minecraft_label=26.3
# Vanilla Minecraft (NeoForm) used to compile the common module. See https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1
neo_version=26.3.0.101
# The lowest NeoForge version the mod declares support for (the first NeoForge build for 26.3, a beta; the first stable is 26.3.0.76).
# Verify with: ./gradlew :neoforge:compileJava "-Pneo_version=26.3.0.0-beta"
neo_version_range=[26.3.0.0-beta,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

# Fabric. The jar is compiled against minecraft_version and only supports Minecraft 26.3.
# Verify with: ./gradlew :fabric:compileJava "-Pfabric_api_version=0.160.6+26.3" "-Pfabric_loader_version=0.19.3"
fabric_loader_version=0.20.1
# The minimum Fabric API requires Loader 0.19.3.
fabric_loader_version_range=>=0.19.3
# Fabric API loads the block tag shipped in the mod jar (fabric-resource-loader-v1).
fabric_api_version=0.165.2+26.3
# Minimum Fabric API: 0.160.6 is the first build for the 26.3 release (0.160.5 still targets 26.3-rc-3).
# Build metadata (+26.3) is ignored in version comparisons.
fabric_api_version_range=>=0.160.6
fabric_minecraft_version_range=26.3

# Forge. 26.3 uses the 66 series. Verify the minimum with: ./gradlew :forge:compileJava "-Pforge_version=66.0.0"
forge_version=66.1.5
forge_version_range=[66.0.0,)
forge_loader_version_range=[66,)

mod_id=golemandwitherspawnfix
mod_name=Golem and Wither Spawn Fix
mod_license=MIT
mod_version=1.0.0
mod_group_id=io.github.emberbocor.golemandwitherspawnfix
