modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/emberbocor/golemandwitherspawnfix/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/emberbocor/golemandwitherspawnfix"
authors="emberbocor"
displayTest="IGNORE_SERVER_VERSION"
description='''
Iron golems and withers spawn even when grass, snow, carpets or other small blocks sit in the empty spots of their build.
Only needed on the server: players without the mod can join.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
